<!DOCTYPE html>
<html lang="sr">

<head>
<link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#c8102e">

<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="autocomplete" content="off">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin prijava | KK Tempo</title>


<style>

*{
box-sizing:border-box;
font-family:Arial,sans-serif;
}


body{

margin:0;
min-height:100vh;

background:#ffffff;

display:flex;
justify-content:center;
align-items:center;

font-family:Arial,sans-serif;

}


/* LOGIN KARTICA */

.login-box{

background:white;

width:380px;

padding:40px;

border-radius:20px;

text-align:center;

box-shadow:0 5px 15px rgba(0,0,0,.15);

}


.logo{

font-size:70px;

margin-bottom:10px;

}


h1{

color:#c8102e;

margin-bottom:10px;

}


p{

color:#666;

margin-bottom:30px;

}


input{

width:100%;

padding:15px;

border-radius:30px;

border:1px solid #ddd;

font-size:16px;

text-align:center;

outline:none;

margin-bottom:20px;

}



button{

width:100%;

padding:15px;

border:none;

border-radius:30px;

background:linear-gradient(135deg,#c8102e,#8b001f);

color:white;

font-size:16px;

font-weight:bold;

cursor:pointer;

transition:.3s;

}



button:hover{

transform:translateY(-4px);

box-shadow:0 10px 25px rgba(200,16,46,.4);

}



.greska{

color:red;

font-weight:bold;

margin-top:15px;

}



</style>


</head>


<body>



<div class="login-box">


<div class="logo">

</div>


<h1>
ADMIN PANEL
</h1>


<p>
PRIJAVA
</p>


<input 
type="password" 
id="lozinka"
autocomplete="new-password">



<button onclick="prijava()">

ULAZ

</button>



<div class="greska" id="greska"></div>



</div>





<script>


const LOZINKA="300321";


function prijava(){

    let sifra = document.getElementById("lozinka").value;


    if(sifra === "300321"){

        sessionStorage.setItem("adminPrijava","true");

        window.location.href="admin.html";

    }
    else{

        document.getElementById("greska").innerHTML =
        "Pogrešna lozinka!";

    }

}


</script>

<script>

if("serviceWorker" in navigator){

    navigator.serviceWorker.register("service-worker.js");

}

</script>


</body>

</html>
