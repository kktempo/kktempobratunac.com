<!DOCTYPE html>
<html lang="sr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Evidencija treninga</title>

<link rel="stylesheet" href="evidencija.css">

</head>

<body>

<div class="container">

<h1>EVIDENCIJA PRISUSTVA NA TRENZIMA</h1>

<select id="grupa" onchange="ucitajGrupu()">

<option value="mini">GRUPA 1</option>
<option value="mladji">GRUPA 2</option>
<option value="kadeti">GRUPA 3</option>

</select>

<div class="datum-box">

<label>Datum treninga:</label>

<input type="date" id="datum">

</div>

<table>

<thead>

<tr>

<th>Ime</th>
<th>Prisutan</th>
<th>Nije prisutan</th>

</tr>

</thead>

<tbody id="tabela">

</tbody>

</table>

<button onclick="sacuvaj()">
SAČUVAJ EVIDENCIJU
</button>

<button onclick="izveziPDF()">
📄 IZVEZI PDF
</button>

</div>

<script>

const grupe={

mini:[
"Milos Radic",
"Ivan Radic",
"Luka Krsmanovic",
"Marko Pajic",
"Lazar Milicevic",
"Srdjan Barjaktarevic",
"Marko Zolotic",
"Aleksije Reljic"
],

mladji:[
"Matija Cetkovic",
"Andrej Nikolic",
"Damjan Petkovic",
"Stefan Zivanovic",
"Brano Tripunovic",
"Mihajlo Ilic",
"Luka Cvjetinovic",
"Nina Cvjetinovic",
"Petar Grujicic",
"Stefan Jovanovic",
"Teodor Jovanovic",
"Mihajlo Davidovic",
"Uros Blagojevic",
"Zlatko Djuric",
"Dunja Ilic",
"Vuk Trifunovic"
],

kadeti:[
"Matija Gligorevic",
"Lazar Grabovac",
"Kosta Cetkovic",
"Uros Cvjetinovic",
"Milos Mrakic",
"Veljko Vuksic",
"Aleksej Krsmanovic",
"Stefan Ateljevic",
"Nikola Petrovic",
"Kristian Mijatovic",
"Viktor Mijatovic",
"Dositej Lazic",
"Nemanja Gavric",
"Strahinja Radovic",
"Dusan Radovic",
"Vuk Trisic",
"Pavle Andric",
"Nikola Jovanovic",
"Rastko Stevanovic",
"Pavle Pavlovic"
]

};

function ucitajGrupu(){

let grupa=document.getElementById("grupa").value;
let tabela=document.getElementById("tabela");

tabela.innerHTML="";

grupe[grupa].forEach(ime=>{

tabela.innerHTML+=`

<tr>

<td>${ime}</td>

<td>

<button
class="status-btn prisutan"
onclick="izaberiStatus(this,'${ime}','Prisutan')">
PRISUTAN
</button>

</td>

<td>

<button
class="status-btn odsutan"
onclick="izaberiStatus(this,'${ime}','Nije prisutan')">
NIJE PRISUTAN
</button>

</td>

</tr>

`;

});

}

ucitajGrupu();

let statusi={};

function izaberiStatus(dugme, ime, status){

    statusi[ime]=status;

    let red=dugme.parentElement.parentElement;

    red.querySelectorAll(".status-btn").forEach(btn=>{
        btn.classList.remove("active");
    });

    dugme.classList.add("active");

}

document.getElementById("datum").value =
new Date().toISOString().split("T")[0];

function sacuvaj(){

let grupa=document.getElementById("grupa").value;

let evidencija={};

grupe[grupa].forEach(ime=>{

evidencija[ime]=statusi[ime] || "Nije označeno";

});

async function izveziPDF(){

const { jsPDF } = window.jspdf;

const pdf = new jsPDF();

let grupa=document.getElementById("grupa").value;
let datum=document.getElementById("datum").value;

pdf.setFontSize(18);
pdf.text("KK TEMPO BRATUNAC",105,15,{align:"center"});

pdf.setFontSize(15);
pdf.text("EVIDENCIJA TRENINGA",105,25,{align:"center"});

pdf.setFontSize(12);
pdf.text("Datum: "+datum,20,40);
pdf.text("Grupa: "+grupa.toUpperCase(),20,48);

let y=65;

pdf.text("R.br",15,y);
pdf.text("Ime",35,y);
pdf.text("Status",150,y);

y+=8;

let prisutni=0;
let odsutni=0;

grupe[grupa].forEach((ime,index)=>{

let status=statusi[ime] || "Nije označeno";

pdf.text(String(index+1),15,y);
pdf.text(ime,35,y);
pdf.text(status,150,y);

if(status==="Prisutan") prisutni++;
if(status==="Nije prisutan") odsutni++;

y+=8;

if(y>270){

pdf.addPage();

y=20;

}

});

y+=10;

pdf.setFontSize(13);

pdf.text("Prisutno: "+prisutni,20,y);

pdf.text("Odsutno: "+odsutni,20,y+8);

pdf.text("Ukupno: "+grupe[grupa].length,20,y+16);

pdf.save("Evidencija_"+grupa+"_"+datum+".pdf");

}

let datum = document.getElementById("datum").value;

localStorage.setItem(
"evidencija_"+grupa+"_"+datum,
JSON.stringify(evidencija)
);

alert("Evidencija sačuvana.");

}

</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

</body>
</html>
