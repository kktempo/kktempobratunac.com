<!DOCTYPE html>
<html lang="sr">

<head>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Evidencija treninga</title>

<link rel="stylesheet" href="evidencija.css">

</head>

<body>

<button onclick="location.href='admin.html'" class="nazad-btn">
⬅ NAZAD
</button>

<div class="container">

<h1>EVIDENCIJA PRISUSTVA NA TRENINZIMA</h1>
<select id="grupa" onchange="ucitajGrupu()">

<option value="mini">GRUPA 1</option>
<option value="mladji">GRUPA 2</option>
<option value="kadeti">GRUPA 3</option>

</select>

<div class="datum-box">

<label>Datum treninga:</label>

<input type="date" id="datum">

</div>

<table>

<thead>

<tr>

<th>Ime</th>
<th>Prisutan</th>
<th>Nije prisutan</th>

</tr>

</thead>

<tbody id="tabela">

</tbody>

</table>

<button onclick="sacuvaj()">
SAČUVAJ EVIDENCIJU
</button>

<button onclick="izveziPDF()">
📄 IZVEZI PDF
</button>

</div>

<script>

const grupe={

mini:[
"Milos Radic",
"Ivan Radic",
"Luka Krsmanovic",
"Marko Pajic",
"Lazar Milicevic",
"Srdjan Barjaktarevic",
"Marko Zolotic",
"Aleksije Reljic"
],

mladji:[
"Matija Cetkovic",
"Andrej Nikolic",
"Damjan Petkovic",
"Stefan Zivanovic",
"Brano Tripunovic",
"Mihajlo Ilic",
"Luka Cvjetinovic",
"Nina Cvjetinovic",
"Petar Grujicic",
"Stefan Jovanovic",
"Teodor Jovanovic",
"Mihajlo Davidovic",
"Uros Blagojevic",
"Zlatko Djuric",
"Dunja Ilic",
"Vuk Trifunovic"
],

kadeti:[
"Matija Gligorevic",
"Lazar Grabovac",
"Kosta Cetkovic",
"Uros Cvjetinovic",
"Milos Mrakic",
"Veljko Vuksic",
"Aleksej Krsmanovic",
"Stefan Ateljevic",
"Nikola Petrovic",
"Kristian Mijatovic",
"Viktor Mijatovic",
"Dositej Lazic",
"Nemanja Gavric",
"Strahinja Radovic",
"Dusan Radovic",
"Vuk Trisic",
"Pavle Andric",
"Nikola Jovanovic",
"Rastko Stevanovic",
"Pavle Pavlovic"
]

};

function ucitajGrupu(){

let grupa=document.getElementById("grupa").value;
let tabela=document.getElementById("tabela");

tabela.innerHTML="";

grupe[grupa].forEach(ime=>{

tabela.innerHTML+=`

<tr>

<td>${ime}</td>

<td>

<button
class="status-btn prisutan"
onclick="izaberiStatus(this,'${ime}','Prisutan')">
PRISUTAN
</button>

</td>

<td>

<button
class="status-btn odsutan"
onclick="izaberiStatus(this,'${ime}','Nije prisutan')">
NIJE PRISUTAN
</button>

</td>

</tr>

`;

});

ucitajSacuvanuEvidenciju();

}

ucitajGrupu();

let statusi={};

function izaberiStatus(dugme, ime, status){

    statusi[ime]=status;

    let red=dugme.parentElement.parentElement;

    red.querySelectorAll(".status-btn").forEach(btn=>{
        btn.classList.remove("active");
    });

    dugme.classList.add("active");

}

document.getElementById("datum").value =
new Date().toISOString().split("T")[0];

document.getElementById("datum")
.addEventListener("change", ucitajSacuvanuEvidenciju);

function sacuvaj(){

    let grupa = document.getElementById("grupa").value;
    let datum = document.getElementById("datum").value;

    let evidencija = {};

    grupe[grupa].forEach(ime => {

        evidencija[ime] = statusi[ime] || "Nije označeno";

    });

    // Čuvanje evidencije
    localStorage.setItem(
        "evidencija_" + grupa + "_" + datum,
        JSON.stringify(evidencija)
    );

    // Dodavanje u arhivu
    let lista = JSON.parse(localStorage.getItem("listaEvidencija")) || [];

    if(!lista.find(x => x.grupa === grupa && x.datum === datum)){

        lista.push({
            datum: datum,
            grupa: grupa
        });

        localStorage.setItem(
            "listaEvidencija",
            JSON.stringify(lista)
        );

    }

    alert("Evidencija sačuvana.");

}

function ucitajSacuvanuEvidenciju(){

    let grupa = document.getElementById("grupa").value;
    let datum = document.getElementById("datum").value;

    if(!datum) return;


    let sacuvano = localStorage.getItem(
        "evidencija_" + grupa + "_" + datum
    );


    if(!sacuvano){
        statusi = {};
        return;
    }


    statusi = JSON.parse(sacuvano);


    let redovi = document.querySelectorAll("#tabela tr");


    redovi.forEach(red=>{

        let ime = red.cells[0].innerText;


        let status = statusi[ime];


        red.querySelectorAll(".status-btn")
        .forEach(btn=>{

            btn.classList.remove("active");

        });


        if(status==="Prisutan"){

            red.querySelector(".prisutan")
            .classList.add("active");

        }


        if(status==="Nije prisutan"){

            red.querySelector(".odsutan")
            .classList.add("active");

        }


    });

}

async function izveziPDF(){

const { jsPDF } = window.jspdf;

const pdf = new jsPDF();

let grupa=document.getElementById("grupa").value;
let datum=document.getElementById("datum").value;

if(!grupa || !datum){
    alert("Izaberite grupu i datum!");
    return;
}


// NASLOV

pdf.setFontSize(18);
pdf.text("KK TEMPO BRATUNAC",105,15,{align:"center"});

pdf.setFontSize(15);
pdf.text("EVIDENCIJA TRENINGA",105,25,{align:"center"});


pdf.setFontSize(12);
pdf.text("Datum: "+datum,20,40);
let nazivGrupe = {
    mini: "GRUPA 1",
    mladji: "GRUPA 2",
    kadeti: "GRUPA 3"
};


pdf.text("Grupa: "+(nazivGrupe[grupa] || grupa.toUpperCase()),20,48);


// TABELA

let y=65;


function zaglavlje(){

pdf.setFontSize(12);

pdf.rect(15,y-7,180,10);

pdf.text("R.br",20,y);
pdf.text("Ime i prezime",45,y);
pdf.text("Status",150,y);

y+=10;

}


zaglavlje();


let prisutni=0;
let odsutni=0;


grupe[grupa].forEach((ime,index)=>{


let status=statusi[ime] || "Nije označeno";


if(status==="Prisutan") prisutni++;
if(status==="Nije prisutan") odsutni++;


pdf.rect(15,y-7,180,10);

pdf.text(String(index+1),20,y);

pdf.text(ime,45,y);

pdf.text(status,150,y);


y+=10;



// nova strana

if(y>270){

pdf.addPage();

y=20;

zaglavlje();

}


});


// REZULTATI

y+=10;

pdf.setFontSize(13);

pdf.text("STATISTIKA",20,y);

y+=10;

pdf.setFontSize(12);

pdf.text("Prisutno: "+prisutni,20,y);

pdf.text("Odsutno: "+odsutni,20,y+8);

pdf.text("Ukupno članova: "+grupe[grupa].length,20,y+16);



pdf.save(
"Evidencija_"+grupa+"_"+datum+".pdf"
);


}

</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>


</body>
</html>
