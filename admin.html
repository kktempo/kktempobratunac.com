<!DOCTYPE html>
<html lang="sr">

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin panel | KK Tempo</title>

<link rel="stylesheet" href="style.css">

<style>

body{
    font-family:Arial,sans-serif;
    background:#f5f5f5;
    margin:0;
}

.admin{
    width:95%;
    max-width:1300px;
    margin:40px auto;
}

h1{
    text-align:center;
    color:#c8102e;
}

.statistika{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:20px;
    margin:30px 0;
}

.kartica{
    background:white;
    padding:25px;
    border-radius:15px;
    text-align:center;
    box-shadow:0 5px 15px rgba(0,0,0,.15);
}

.kartica h2{
    color:#c8102e;
    font-size:34px;
    margin:0;
}

table{
    width:100%;
    border-collapse:collapse;
    background:white;
    box-shadow:0 5px 15px rgba(0,0,0,.15);
}

th{
    background:#c8102e;
    color:white;
    padding:15px;
}

td{
    padding:12px;
    text-align:center;
    border-bottom:1px solid #ddd;
}

.pl{
    color:green;
    font-weight:bold;
}

.npl{
    color:red;
    font-weight:bold;
}

@media(max-width:900px){

.statistika{
grid-template-columns:repeat(2,1fr);
}

}

@media(max-width:600px){

.statistika{
grid-template-columns:1fr;
}

}

</style>

</head>

<body>

<section class="admin">

<h1>ADMIN PANEL</h1>

<button onclick="izveziPDF()" class="pdf-dugme">
📄 IZVEZI PDF
</button>

<div class="statistika">

<div class="kartica">
<h2 id="brojClanova">0</h2>
<p>Članova</p>
</div>

<div class="kartica">
<h2 id="ukupnoClanarine">0 KM</h2>
<p>Ukupno članarine</p>
</div>

<div class="kartica">
<h2 id="naplaceno">0 KM</h2>
<p>Naplaćeno</p>
</div>

<div class="kartica">
<h2 id="dugovanja">0 KM</h2>
<p>Dugovanja</p>
</div>

</div>

<div class="pretraga">

<input
type="text"
id="pretraga"
placeholder="🔍 Pretraži po imenu ili šifri..."
onkeyup="pretraziClanove()">

</div>

<table>

<thead>

<tr>
<th>Šifra</th>
<th>Ime</th>
<th>Program</th>
<th>Cena</th>
<th>Ukupan dug</th>
<th>Status</th>
<th>Akcija</th>
</tr>

</thead>

<tbody id="tabela"></tbody>

</table>

</section>

<script>

const clanovi={

"MATIJAG2014":{
ime:"Matija Gligorević",
program:"Program 2",
cena:40,

clanarine:{}
},

"GRABOVACL2014":{
ime:"Lazar Grabovac",

cena:40,

clanarine:{}
},

"DAMJANP2018":{

cena:30,

},

"LUKAK2013":{

program:"Program 2",
cena:40,

clanarine:{}
},

"STEFANZ2016":{
ime:"Stefan Zivanovic",
program:"Program 1",
cena:30,

clanarine:{}
},

"ANDREJN2015":{
ime:"Andrej Nikolic",
program:"Program 2",
cena:40,

clanarine:{}
},

"LUKAC2016":{
ime:"Luka Cvjetinovic",
program:"Program 2",
cena:40,

clanarine:{}
},

"NINAC2015":{
ime:"Nina Cvjetinovic",

cena:30,

clanarine:{}
},

"PETARG2017":{
ime:"Petar Grujicic",
program:"Program 1",
cena:30,

clanarine:{}
},

"IVANR2012":{

program:"Program 1",
cena:30,

clanarine:{}
},

"MILOSR2014":{
ime:"Milos Radic",
program:"Program 1",
cena:20,

clanarine:{}
},

"KOSTAĆ2015":{
ime:"Kosta Cetkovic",
program:"Program 2",
cena:40,

clanarine:{}
},

"UROSC2015":{
ime:"Uros Cvjetinovic",
program:"Program 1",
cena:30,

clanarine:{}
},

"MILOSM2014":{
ime:"Milos Mrakic",
program:"Program 3",
cena:50,

clanarine:{}
},

"VELJKOV2015":{
ime:"Veljko Vuksic",
program:"Program 3",
cena:50,

clanarine:{}
},

"АЛЕКСЕЈК2015":{
ime:"Aleksej Krsmanovic",
program:"Program 3",
cena:50,

clanarine:{}
},

"STEFANA2014":{
ime:"Stefan Ateljevic",
program:"Program 1",
cena:30,

clanarine:{}
},

"NIKOLAP2016":{
ime:"Nikola Petrovic",
program:"Program 1",
cena:30,

clanarine:{}
},

"KRISTIANM2013":{
ime:"Kristian Mijatovic",
program:"Program 2",
cena:40,

clanarine:{}
},

"VIKTORM2015":{
ime:"Viktor Mijatovic",
program:"Program 2",
cena:30,

clanarine:{}
},

"DOSITEJL2015":{
ime:"Dositej Lazic",
program:"Program 1",
cena:30,

clanarine:{}
},

"NEMANJAG2015":{
ime:"Nemanja Gavric",
program:"Program 1",
cena:30,

clanarine:{}
},

"STRAHINJAR2014":{
ime:"Strahinja Radovic",
program:"Program 3",
cena:50,

clanarine:{}
},

"DUSANR2014":{

},

"VUKT2015":{

},

"STEFANJ2015":{

},

"TEODORJ2019":{
ime:"Teodor Jovanovic",

},

"PAVLEA2014":{

},

"NIKOLAJ2013":{

program:"Program 2",
cena:40,

clanarine:{}
},

"MATIJAĆ2018":{
ime:"Matija Cetkovic",
program:"Program 1",
cena:20,

clanarine:{}
},

"MIHAJLOD2018":{
ime:"Mihajlo Davidovic",
program:"Program 1",
cena:30,

clanarine:{}
},

};

// učitavanje sačuvanih uplata
let sacuvaneClanarine = localStorage.getItem("clanarine");


if(sacuvaneClanarine){

    let podaci = JSON.parse(sacuvaneClanarine);


    for(let sifra in podaci){

        if(clanovi[sifra]){

            clanovi[sifra].clanarine = podaci[sifra];

        }

    }

}

function proveriMesecneDugove(){

    let datum = new Date();

    let godina = datum.getFullYear();
    let mesec = datum.getMonth()+1;


    if(mesec < 10){
        mesec = "0" + mesec;
    }


    let trenutniMesec = godina + "-" + mesec;


    for(let sifra in clanovi){

        let clan = clanovi[sifra];


        // ako ne postoji zapis za ovaj mesec
        if(!clan.clanarine[trenutniMesec]){


            clan.clanarine[trenutniMesec]={

                iznos: clan.cena,
                status:"NIJE PLAĆENO"

            };


        }

    }

}


// pokretanje pri otvaranju admin panela
proveriMesecneDugove();

let ukupno=0;
let naplaceno=0;
let dug=0;
let broj=0;

for(let sifra in clanovi){

let clan=clanovi[sifra];

broj++;


let danas = new Date();

let godina = danas.getFullYear();

let mesec = danas.getMonth()+1;

if(mesec<10){
mesec="0"+mesec;
}

let aktivniMesec = godina+"-"+mesec;



if(!clan.clanarine[aktivniMesec]){

    clan.clanarine[aktivniMesec]={

        iznos: clan.cena,

        status:"NIJE PLAĆENO"

    };

}


let clanarina = clan.clanarine[aktivniMesec];


// sigurnosna provera
if(!clanarina){

    clanarina = {

        iznos: clan.cena,

        status:"NIJE PLAĆENO"

    };


    clan.clanarine[aktivniMesec]=clanarina;

}



ukupno += clanarina.iznos;


if(clanarina.status==="PLAĆENO"){

    naplaceno += clanarina.iznos;

}
else{

    dug += clanarina.iznos;

}

document.getElementById("tabela").innerHTML+=`

<tr>
<td>${sifra}</td>
<td>${clan.ime}</td>
<td>${clan.program}</td>
<td>
${clan.cena} KM
</td>


<td class="${izracunajDug(clan)>0 ? 'npl' : 'pl'}">
${izracunajDug(clan)} KM
</td>


<td class="${clanarina.status==="PLAĆENO" ? "pl" : "npl"}">

${clanarina.status}

</td>

<td>

<button onclick="promeniStatus('${sifra}')">

${
clanarina.status==="PLAĆENO"
?
"PONIŠTI UPLATU"
:
"PLATIO"
}

</button>

</td>
</tr>

`;

}

document.getElementById("brojClanova").innerHTML=broj;
document.getElementById("ukupnoClanarine").innerHTML=ukupno+" KM";
document.getElementById("naplaceno").innerHTML=naplaceno+" KM";
document.getElementById("dugovanja").innerHTML=dug+" KM";

function pretraziClanove(){

    let filter = document.getElementById("pretraga")
        .value.toUpperCase();

    let redovi = document.querySelectorAll("#tabela tr");

    redovi.forEach(red=>{

        let sifra = red.cells[0].textContent.toUpperCase();
        let ime = red.cells[1].textContent.toUpperCase();

        if(
            sifra.includes(filter) ||
            ime.includes(filter)
        ){
            red.style.display="";
        }else{
            red.style.display="none";
        }

    });

}
function izracunajDug(clan){

    let dug = 0;


    for(let mesec in clan.clanarine){

        let zapis = clan.clanarine[mesec];


        if(zapis && zapis.status==="NIJE PLAĆENO"){

            dug += zapis.iznos;

        }

    }


    return dug;

}

function promeniStatus(sifra){

    let datum = new Date();


    let godina = datum.getFullYear();

    let mesec = datum.getMonth()+1;


    if(mesec < 10){
        mesec="0"+mesec;
    }


    let trenutniMesec = godina+"-"+mesec;



    let clanarina = clanovi[sifra].clanarine[trenutniMesec];



    if(clanarina.status==="PLAĆENO"){


        // vraćanje na nije plaćeno

        clanovi[sifra].clanarine[trenutniMesec]={

            iznos: clanovi[sifra].cena,

            status:"NIJE PLAĆENO"

        };


    }else{


        // evidentiranje uplate

        clanovi[sifra].clanarine[trenutniMesec]={

            iznos: clanovi[sifra].cena,

            status:"PLAĆENO",

            datumUplate: datum.toISOString().split("T")[0]

        };


    }



    // čuvanje



    let zaCuvanje={};


    for(let ime in clanovi){

        zaCuvanje[ime]=clanovi[ime].clanarine;

    }


    localStorage.setItem(
        "clanarine",
        JSON.stringify(zaCuvanje)
    );


    location.reload();

}
function izveziPDF(){


const { jsPDF } = window.jspdf;


let pdf = new jsPDF("landscape");



pdf.setFontSize(18);

pdf.text(
"KK TEMPO BRATUNAC - EVIDENCIJA CLANARINA",
14,
15
);



pdf.setFontSize(11);

let datum = new Date().toLocaleDateString("sr-RS");


pdf.text(
"Datum izvoza: " + datum,
14,
23
);



let tabela = [];



for(let sifra in clanovi){


let clan = clanovi[sifra];


let dug = izracunajDug(clan);



let status = dug > 0 
?
"NIJE PLACENO"
:
"PLACENO";



tabela.push([

sifra,

clan.ime,

clan.program,

clan.cena+" KM",

dug+" KM",

status

]);


}



pdf.autoTable({

startY:30,

head:[

[
"Sifra",
"Ime",
"Program",
"Cena",
"Ukupan dug",
"Status"

]

],


body:tabela,


styles:{

fontSize:9

},


headStyles:{

fillColor:[200,16,46]

}


});



pdf.save(
"KK_Tempo_clanarine.pdf"
);


}

</script>

</body>
</html>
