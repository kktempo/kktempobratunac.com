<!DOCTYPE html>
<html lang="sr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin panel | KK Tempo</title>

<link rel="stylesheet" href="style.css">

<style>

body{
    font-family:Arial,sans-serif;
    background:#f5f5f5;
    margin:0;
}

.admin{
    width:95%;
    max-width:1300px;
    margin:40px auto;
}

h1{
    text-align:center;
    color:#c8102e;
}

.statistika{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:20px;
    margin:30px 0;
}

.kartica{
    background:white;
    padding:25px;
    border-radius:15px;
    text-align:center;
    box-shadow:0 5px 15px rgba(0,0,0,.15);
}

.kartica h2{
    color:#c8102e;
    font-size:34px;
    margin:0;
}

table{
    width:100%;
    border-collapse:collapse;
    background:white;
    box-shadow:0 5px 15px rgba(0,0,0,.15);
}

th{
    background:#c8102e;
    color:white;
    padding:15px;
}

td{
    padding:12px;
    text-align:center;
    border-bottom:1px solid #ddd;
}

.pl{
    color:green;
    font-weight:bold;
}

.npl{
    color:red;
    font-weight:bold;
}

@media(max-width:900px){

.statistika{
grid-template-columns:repeat(2,1fr);
}

}

@media(max-width:600px){

.statistika{
grid-template-columns:1fr;
}

}

</style>

</head>

<body>

<section class="admin">

<h1>ADMIN PANEL</h1>

<div class="statistika">

<div class="kartica">
<h2 id="brojClanova">0</h2>
<p>Članova</p>
</div>

<div class="kartica">
<h2 id="ukupnoClanarine">0 KM</h2>
<p>Ukupno članarine</p>
</div>

<div class="kartica">
<h2 id="naplaceno">0 KM</h2>
<p>Naplaćeno</p>
</div>

<div class="kartica">
<h2 id="dugovanja">0 KM</h2>
<p>Dugovanja</p>
</div>

</div>

<div class="pretraga">

<input
type="text"
id="pretraga"
placeholder="🔍 Pretraži po imenu ili šifri..."
onkeyup="pretraziClanove()">

</div>

<table>

<thead>

<tr>
<th>Šifra</th>
<th>Ime</th>
<th>Program</th>
<th>Cena</th>

<tbody id="tabela"></tbody>

</section>

let ukupno=0;
let naplaceno=0;
let dug=0;
let broj=0;

for(let sifra in clanovi){

let clan=clanovi[sifra];

broj++;

ukupno+=clan.cena;

if(clan.status==="PLAĆENO"){
naplaceno+=clan.cena;
}else{
dug+=clan.cena;
}

document.getElementById("tabela").innerHTML+=`

<tr>
<td>${sifra}</td>
<td>${clan.ime}</td>
<td>${clan.program}</td>
<td>${clan.cena} KM</td>
<td class="${clan.status==="PLAĆENO" ? "pl" : "npl"}">
${clan.status}
</td>
</tr>

`;

}

document.getElementById("brojClanova").innerHTML=broj;
document.getElementById("ukupnoClanarine").innerHTML=ukupno+" KM";
document.getElementById("naplaceno").innerHTML=naplaceno+" KM";
document.getElementById("dugovanja").innerHTML=dug+" KM";

function pretraziClanove(){

    let filter = document.getElementById("pretraga")
        .value.toUpperCase();

    let redovi = document.querySelectorAll("#tabela tr");

    redovi.forEach(red=>{

        let sifra = red.cells[0].textContent.toUpperCase();
        let ime = red.cells[1].textContent.toUpperCase();

        if(
            sifra.includes(filter) ||
            ime.includes(filter)
        ){
            red.style.display="";
        }else{
            red.style.display="none";
        }

    });

}
