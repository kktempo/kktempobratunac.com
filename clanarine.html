    let podaci = JSON.parse(sacuvaneClanarine);


    for(let sifra in podaci){

clanovi[sifra].clanarine = podaci[sifra].clanarine || {};

clanovi[sifra].pauza = podaci[sifra].pauza || {};

        }

    }

function imaPauzu(clan, mesec){

    return !!(
        clan &&
        clan.pauza &&
        clan.pauza[mesec] === true
    );

}

function proveriMesecneDugove(){

    let datum = new Date();

    let godina = datum.getFullYear();
    let trenutniMesec = datum.getMonth()+1;


    for(let sifra in clanovi){

        let clan = clanovi[sifra];


        // prolazi kroz sve mesece od januara do sada
        for(let i = 7; i <= trenutniMesec; i++){


            let brojMeseca = i;

            if(brojMeseca < 10){
                brojMeseca = "0" + brojMeseca;
            }


            let mesec = godina + "-" + brojMeseca;


            // ako je pauza - preskoči
            if(imaPauzu(clan, mesec)){
                continue;
            }


            // ako mesec ne postoji, napravi dug
            if(!clan.clanarine[mesec]){


                clan.clanarine[mesec]={

                    iznos: clan.cena,

                    status:"NIJE PLAĆENO"

                };


            }

        }


    }


    // sačuvaj izmene
    localStorage.setItem(
        "clanarine",
        JSON.stringify(clanovi)
    );


}

function pretraziClanove(){

    let filter = document.getElementById("pretraga")
        .value.toUpperCase();

    let redovi = document.querySelectorAll("#tabela tr");

    redovi.forEach(red=>{

        let sifra = red.cells[0].textContent.toUpperCase();
        let ime = red.cells[1].textContent.toUpperCase();

        if(
            sifra.includes(filter) ||
            ime.includes(filter)
        ){
            red.style.display="";
        }else{
            red.style.display="none";
        }

    });

}

function primeniFiltere(){

    let tekst =
        document.getElementById("pretraga")
        .value
        .toUpperCase()
        .trim();

    let filterDug =
        document.getElementById("filterDug")
        .value;

    let redovi =
        document.querySelectorAll("#tabela tr");


    redovi.forEach(red => {

        if(red.cells.length < 5){
            return;
        }


        let sifra =
            red.cells[0]
            .textContent
            .toUpperCase();

        let ime =
            red.cells[1]
            .textContent
            .toUpperCase();


        // ==========================
        // PRETRAGA IMENA / ŠIFRE
        // ==========================

        let odgovaraTekstu =
            sifra.includes(tekst) ||
            ime.includes(tekst);


        // ==========================
        // FILTER DUŽNIKA
        // ==========================

        let dug =
            parseFloat(
                red.cells[4]
                .textContent
                .replace("KM","")
                .trim()
            ) || 0;


        let odgovaraDugu = true;


        if(filterDug === "duznici"){

            odgovaraDugu = dug > 0;

        }


        // ==========================
        // PRIKAŽI / SAKRIJ
        // ==========================

        if(
            odgovaraTekstu &&
            odgovaraDugu
        ){

            red.style.display = "";

        }else{

            red.style.display = "none";

        }

    });

}

function izracunajDug(clan){

    let dug = 0;

    if(!clan || !clan.clanarine){
        return 0;
    }

    for(let mesec in clan.clanarine){

        let zapis = clan.clanarine[mesec];

        if(!zapis){
            continue;
        }

        // AKO JE MESEC NA PAUZI - NE RAČUNAJ DUG
        if(imaPauzu(clan, mesec)){
            continue;
        }

        if(zapis.status === "NIJE PLAĆENO"){

            dug += Number(zapis.iznos) || 0;

        }

    }

    return dug;

}

function promeniStatus(sifra){

    let clan = clanovi[sifra];

    if(!clan){

        alert("Član nije pronađen.");

        return;

    }


    let datum = new Date();

    let godina = datum.getFullYear();

    let trenutniMesec = datum.getMonth();


    // ==========================================
    // 4 MESECA - TEKUĆI + 3 UNAZAD
    // ==========================================

    let meseci = [];

    let naziviMeseci = [

        "Januar",
        "Februar",
        "Mart",
        "April",
        "Maj",
        "Jun",
        "Jul",
        "Avgust",
        "Septembar",
        "Oktobar",
        "Novembar",
        "Decembar"

    ];


    for(let i = 0; i < 4; i++){

        let d = new Date(
            godina,
            trenutniMesec - i,
            1
        );

        let g = d.getFullYear();

        let m =
            String(d.getMonth() + 1)
            .padStart(2,"0");

        let naziv =
            naziviMeseci[
                d.getMonth()
            ];

        let vrednost =
            g + "-" + m;

        let placeno =
            clan.clanarine &&
            clan.clanarine[vrednost] &&
            clan.clanarine[vrednost].status ===
            "PLAĆENO";


        meseci.push({

            vrednost: vrednost,

            naziv: naziv,

            godina: g,

            placeno: placeno

        });

    }


    // ==========================================
    // UKLONI STARI POPUP
    // ==========================================

    let stari =
        document.getElementById(
            "izborMesecaOverlay"
        );

    if(stari){

        stari.remove();

    }


    // ==========================================
    // NAPRAVI POPUP
    // ==========================================

    let overlay =
        document.createElement("div");

    overlay.id =
        "izborMesecaOverlay";


    let dugmad = "";


    meseci.forEach(function(mesec){

        dugmad += `

            <button
                type="button"
                class="dugmeMesec ${
                    mesec.placeno
                    ? "mesecPlaceno"
                    : ""
                }"
                onclick="
                    obradiUplatuMeseca(
                        '${sifra}',
                        '${mesec.vrednost}'
                    )
                "
            >

                <span class="mesecNaziv">
                    ${mesec.naziv}
                </span>

                <span class="mesecGodina">
                    ${mesec.godina}
                </span>

                <span class="mesecStatus">

                    ${
                        mesec.placeno
                        ? "✓ PLAĆENO"
                        : "NIJE PLAĆENO"
                    }

                </span>

            </button>

        `;

    });


    overlay.innerHTML = `

        <div
            class="izborMesecaPopup"
            onclick="event.stopPropagation()"
        >

            <div class="izborMesecaHeader">

                <div class="izborMesecaIkona">
                    📅
                </div>

                <div>

                    <h2>
                        IZBOR MESECA
                    </h2>

                    <p>
                        Izaberite mesec za uplatu
                    </p>

                </div>

            </div>


            <div class="meseciDugmad">

                ${dugmad}

            </div>


            <button
                type="button"
                class="dugmeOtkaziMesec"
                onclick="zatvoriIzborMeseca()"
            >

                ✕ &nbsp; OTKAŽI

            </button>

        </div>

    `;


// UVEK UBACI POPUP DIREKTNO U BODY
document.body.appendChild(overlay);

// Zaključaj skrol stranice dok je popup otvoren
document.body.style.overflow = "hidden";


    overlay.addEventListener(
        "click",
        function(){

            zatvoriIzborMeseca();

        }
    );

}





function obradiUplatuMeseca(
    sifra,
    izabraniMesec
){

    // ==========================================
    // ZATVORI POPUP
    // ==========================================

    zatvoriIzborMeseca();


    let clan =
        clanovi[sifra];


    if(!clan){

        alert(
            "Član nije pronađen."
        );

        return;

    }


    let datum =
        new Date();


    // ==========================================
    // OSIGURAJ CLANARINE
    // ==========================================

    if(!clan.clanarine){

        clan.clanarine = {};

    }


    if(!clan.clanarine[izabraniMesec]){

        clan.clanarine[izabraniMesec] = {

            iznos:
                Number(clan.cena) || 0,

            status:
                "NIJE PLAĆENO"

        };

    }


    let clanarina =
        clan.clanarine[izabraniMesec];


    // ==========================================
    // PONIŠTI UPLATU
    // ==========================================

    if(
        clanarina.status ===
        "PLAĆENO"
    ){

        let potvrda =
            confirm(

                "Mesec " +
                izabraniMesec +
                " je već označen kao PLAĆEN.\n\n" +

                "Da li želite da poništite uplatu?"

            );


        if(!potvrda){

            return;

        }


        clan.clanarine[izabraniMesec] = {

            iznos:
                Number(clan.cena) || 0,

            status:
                "NIJE PLAĆENO"

        };


        localStorage.setItem(
            "clanarine",
            JSON.stringify(clanovi)
        );


        location.reload();

        return;

    }


    // ==========================================
    // EVIDENTIRAJ UPLATU
    // ==========================================

    let iznos =

        Number(clanarina.iznos) ||

        Number(clan.cena) ||

        0;


    clan.clanarine[izabraniMesec] = {

        iznos:
            iznos,

        status:
            "PLAĆENO",

        datumUplate:
            datum
                .toISOString()
                .split("T")[0]

    };


    // ==========================================
    // SAČUVAJ PODATKE
    // ==========================================

    localStorage.setItem(
        "clanarine",
        JSON.stringify(clanovi)
    );


    // ==========================================
    // PODACI ZA POTVRDU
    // ==========================================

    let ime =
        clan.ime ||
        sifra;


    let program =
        clan.program ||
        clan.grupa ||
        "-";


    let email =
        clan.email ||
        "";


    // ==========================================
    // GENERIŠI PDF
    // ==========================================

    napraviPotvrdu(

        sifra,

        izabraniMesec,

        iznos,

        datum

    );


    // ==========================================
    // AKO NEMA EMAIL
    // ==========================================

    if(!email){

        alert(

            "✅ Uplata je evidentirana.\n\n" +

            "PDF potvrda je napravljena.\n\n" +

            "Ovaj član nema unet email."

        );

        return;

    }


    // ==========================================
    // NASLOV MAILA
    // ==========================================

    let naslov =

        "Potvrda o uplati članarine - " +

        ime;


    // ==========================================
    // TEKST MAILA
    // ==========================================

    let poruka =

        "Poštovani,\n\n" +

        "ovim putem potvrđujemo da je evidentirana " +

        "uplata članarine za člana:\n\n" +

        "Ime i prezime: " +

        ime +

        "\n" +

        "Šifra člana: " +

        sifra +

        "\n" +

        "Program: " +

        program +

        "\n" +

        "Mesec: " +

        izabraniMesec +

        "\n" +

        "Iznos: " +

        iznos +

        " KM\n" +

        "Datum uplate: " +

        datum.toLocaleDateString("sr-RS") +

        "\n\n" +

        "Hvala na poverenju,\n\n" +

        "KK Tempo Bratunac";


    // ==========================================
    // OTVARANJE MAILA
    // ==========================================

    let mobilniUredjaj =

        /Android|iPhone|iPad|iPod/i.test(

            navigator.userAgent

        );


    if(mobilniUredjaj){

        let mailToLink =

            "mailto:" +

            email +

            "?subject=" +

            encodeURIComponent(naslov) +

            "&body=" +

            encodeURIComponent(poruka);


        window.location.href =
            mailToLink;


    }else{

        let gmailLink =

            "https://mail.google.com/mail/?view=cm&fs=1" +

            "&to=" +

            encodeURIComponent(email) +

            "&su=" +

            encodeURIComponent(naslov) +

            "&body=" +

            encodeURIComponent(poruka);


        window.open(

            gmailLink,

            "_blank"

        );

    }

}

function pauzirajMesec(sifra){

    let clan = clanovi[sifra];

    if(!clan){

        alert("Član nije pronađen.");

        return;

    }


    if(!clan.pauza){
        clan.pauza = {};
    }


    if(!clan.clanarine){
        clan.clanarine = {};
    }


    let datum = new Date();

    let godina = datum.getFullYear();

    let trenutniMesec =
        datum.getMonth() + 1;


    let meseci = [];


    let naziviMeseci = [

        "Januar",
        "Februar",
        "Mart",
        "April",
        "Maj",
        "Jun",
        "Jul",
        "Avgust",
        "Septembar",
        "Oktobar",
        "Novembar",
        "Decembar"

    ];


    // ==========================================
    // AVGUST → TEKUĆI MESEC
    // ==========================================

    for(let i = 7; i <= trenutniMesec; i++){

        let broj =
            String(i).padStart(2,"0");

        let vrednost =
            godina + "-" + broj;


        meseci.push({

            vrednost: vrednost,

            naziv:
                naziviMeseci[i - 1],

            pauza:
                !!clan.pauza[vrednost]

        });

    }


    // ==========================================
    // POPUP
    // ==========================================

    let overlay =
        document.createElement("div");

    overlay.id =
        "pauzaIzborOverlay";


    let dugmad = "";


    meseci.forEach(function(mesec){

        dugmad += `

            <button
                type="button"
                class="dugmeMesec ${
                    mesec.pauza
                    ? "mesecNaPauzi"
                    : ""
                }"
                onclick="
                    promeniPauzu(
                        '${sifra}',
                        '${mesec.vrednost}'
                    )
                "
            >

                <span class="mesecNaziv">
                    ${mesec.naziv}
                </span>

                <span class="mesecGodina">
                    ${godina}
                </span>

                <span class="mesecStatus">

                    ${
                        mesec.pauza
                        ? "⏸ NA PAUZI"
                        : "AKTIVAN"
                    }

                </span>

            </button>

        `;

    });


    overlay.innerHTML = `

        <div
            class="izborMesecaPopup"
            onclick="event.stopPropagation()"
        >

            <div class="izborMesecaHeader">

                <div class="izborMesecaIkona">
                    ⏸
                </div>

                <div>

                    <h2>
                        PAUZA ČLANARINE
                    </h2>

                    <p>
                        ${clan.ime}
                    </p>

                </div>

            </div>


            <div class="meseciDugmad">

                ${dugmad}

            </div>


            <button
                type="button"
                class="dugmeOtkaziMesec"
                onclick="
                    document
                    .getElementById('pauzaIzborOverlay')
                    .remove()
                "
            >

                ✕ &nbsp; ZATVORI

            </button>

        </div>

    `;


    document.body.appendChild(overlay);


    overlay.addEventListener(
        "click",
        function(){

            overlay.remove();

        }
    );

}

function promeniPauzu(sifra, mesec){

    let clan = clanovi[sifra];

    if(!clan){
        return;
    }


    if(!clan.pauza){
        clan.pauza = {};
    }


    // ==========================================
    // AKO JE VEĆ PAUZA → UKLONI PAUZU
    // ==========================================

    if(clan.pauza[mesec]){

        delete clan.pauza[mesec];


        // vrati članarinu
        if(!clan.clanarine[mesec]){

            clan.clanarine[mesec] = {

                iznos:
                    Number(clan.cena) || 0,

                status:
                    "NIJE PLAĆENO"

            };

        }

    }

    // ==========================================
    // UKLJUČI PAUZU
    // ==========================================

    else{

        clan.pauza[mesec] = true;


        // ukloni članarinu za taj mesec
        if(clan.clanarine){

            delete clan.clanarine[mesec];

        }

    }


    // ==========================================
    // SAČUVAJ
    // ==========================================

    localStorage.setItem(
        "clanarine",
        JSON.stringify(clanovi)
    );


    // ==========================================
    // OSVEŽI
    // ==========================================

    proveriMesecneDugove();

    location.reload();

}

</script>
