// učitavanje sačuvanih uplata
let sacuvaneClanarine = localStorage.getItem("clanarine");


if(sacuvaneClanarine){

    let podaci = JSON.parse(sacuvaneClanarine);


    for(let sifra in podaci){

        if(clanovi[sifra]){
clanovi[sifra].clanarine = podaci[sifra].clanarine || {};

clanovi[sifra].pauza = podaci[sifra].pauza || {};

        }

    }

}

function imaPauzu(clan, mesec){

    if(clan.pauza && clan.pauza[mesec]){

        return true;

    }

    return false;

}


function proveriMesecneDugove(){

    let datum = new Date();

    let godina = datum.getFullYear();
    let trenutniMesec = datum.getMonth()+1;


    for(let sifra in clanovi){

        let clan = clanovi[sifra];


        // prolazi kroz sve mesece od januara do sada
        for(let i = 7; i <= trenutniMesec; i++){


            let brojMeseca = i;

            if(brojMeseca < 10){
                brojMeseca = "0" + brojMeseca;
            }


            let mesec = godina + "-" + brojMeseca;


            // ako je pauza - preskoči
            if(imaPauzu(clan, mesec)){
                continue;
            }


            // ako mesec ne postoji, napravi dug
            if(!clan.clanarine[mesec]){


                clan.clanarine[mesec]={

                    iznos: clan.cena,

                    status:"NIJE PLAĆENO"

                };


            }

        }


    }


    // sačuvaj izmene
    localStorage.setItem(
        "clanarine",
        JSON.stringify(clanovi)
    );


}



// pokretanje pri otvaranju admin panela
proveriMesecneDugove();

let ukupno = 0;
let naplaceno = 0;
let dug = 0;
let broj = 0;


for(let sifra in clanovi){

    let clan = clanovi[sifra];

    broj++;


    // prolazi kroz SVE mesece

    for(let mesec in clan.clanarine){


        let zapis = clan.clanarine[mesec];


        if(!zapis) continue;



        ukupno += zapis.iznos;

    }


    let aktivniMesec = godina+"-"+mesec;


    let clanarina = clan.clanarine[aktivniMesec];

        };

    }

function pretraziClanove(){

    let filter = document.getElementById("pretraga")
        .value.toUpperCase();

    let redovi = document.querySelectorAll("#tabela tr");

    redovi.forEach(red=>{

        let sifra = red.cells[0].textContent.toUpperCase();
        let ime = red.cells[1].textContent.toUpperCase();

        if(
            sifra.includes(filter) ||
            ime.includes(filter)
        ){
            red.style.display="";
        }else{
            red.style.display="none";
        }

    });

}
function izracunajDug(clan){

    let dug = 0;

    for(let mesec in clan.clanarine){

        let zapis = clan.clanarine[mesec];

        if(
            zapis &&
            zapis.status === "NIJE PLAĆENO"
        ){

            dug += zapis.iznos;

        }

    }

    return dug;

}


function promeniStatus(sifra){

    let datum = new Date();

    let godina = datum.getFullYear();

    let mesec = datum.getMonth()+1;

    if(mesec < 10){
        mesec="0"+mesec;
    }

    let trenutniMesec = godina+"-"+mesec;


    // ako ne postoji zapis napravi ga

    if(!clanovi[sifra].clanarine[trenutniMesec]){

        clanovi[sifra].clanarine[trenutniMesec]={

            iznos: clanovi[sifra].cena,

            status:"NIJE PLAĆENO"

        };

    }


    let clanarina = clanovi[sifra].clanarine[trenutniMesec];


    if(clanarina.status==="PLAĆENO"){


        clanovi[sifra].clanarine[trenutniMesec]={

            iznos: clanovi[sifra].cena,

            status:"NIJE PLAĆENO"

        };


    }else{


        clanovi[sifra].clanarine[trenutniMesec]={

            iznos: clanovi[sifra].cena,

            status:"PLAĆENO",

            datumUplate: datum.toISOString().split("T")[0]

        };

    }


    let zaCuvanje={};


    for(let ime in clanovi){

        zaCuvanje[ime]={

            clanarine: clanovi[ime].clanarine,

            pauza: clanovi[ime].pauza

        };

    }


    localStorage.setItem(
        "clanarine",
        JSON.stringify(zaCuvanje)
    );


    location.reload();

}

        let ukupanDug = 0;


        for(let mesec in clan.clanarine){


            let brojMeseca = parseInt(mesec.split("-")[1]);


            // ignoriše januar-jul
            if(brojMeseca < 8){
                continue;

            let uplata = clan.clanarine[mesec];

                <td>${dugMeseci} meseca</td>
                <td>${ukupanDug} KM</td>

    if(brojDuznika === 0){

        tabela.innerHTML = `

        <tr>
            <td colspan="3">
                Nema članova sa dugom od 3 ili više meseci
            </td>
        </tr>
