let sacuvaneClanarine = localStorage.getItem("clanarine");


if(sacuvaneClanarine){

    let podaci = JSON.parse(sacuvaneClanarine);


    for(let sifra in podaci){

        if(clanovi[sifra]){
clanovi[sifra].clanarine = podaci[sifra].clanarine || {};

clanovi[sifra].pauza = podaci[sifra].pauza || {};

        }

    }

}

function imaPauzu(clan, mesec){

    if(clan.pauza && clan.pauza[mesec]){

        return true;

    }

    return false;

}


function proveriMesecneDugove(){

    let datum = new Date();

    let godina = datum.getFullYear();
    let trenutniMesec = datum.getMonth()+1;


    for(let sifra in clanovi){

        let clan = clanovi[sifra];


        // prolazi kroz sve mesece od januara do sada
        for(let i = 7; i <= trenutniMesec; i++){


            let brojMeseca = i;

            if(brojMeseca < 10){
                brojMeseca = "0" + brojMeseca;
            }


            let mesec = godina + "-" + brojMeseca;


            // ako je pauza - preskoči
            if(imaPauzu(clan, mesec)){
                continue;
            }


            // ako mesec ne postoji, napravi dug
            if(!clan.clanarine[mesec]){


                clan.clanarine[mesec]={

                    iznos: clan.cena,

                    status:"NIJE PLAĆENO"

                };


            }

        }


    }


    // sačuvaj izmene
    localStorage.setItem(
        "clanarine",
        JSON.stringify(clanovi)
    );


}



// pokretanje pri otvaranju admin panela
proveriMesecneDugove();

let ukupno = 0;

let dug = 0;
let broj = 0;


for(let sifra in clanovi){

    let clan = clanovi[sifra];

    broj++;


    // prolazi kroz SVE mesece

    for(let mesec in clan.clanarine){

        if(!zapis) continue;



        ukupno += zapis.iznos;

    if(mesec<10){
        mesec="0"+mesec;
    }


    let aktivniMesec = godina+"-"+mesec;


    let clanarina = clan.clanarine[aktivniMesec];

        };

function pretraziClanove(){

    let filter = document.getElementById("pretraga")
        .value.toUpperCase();

    let redovi = document.querySelectorAll("#tabela tr");

    redovi.forEach(red=>{

        let sifra = red.cells[0].textContent.toUpperCase();
        let ime = red.cells[1].textContent.toUpperCase();

        if(
            sifra.includes(filter) ||
            ime.includes(filter)
        ){
            red.style.display="";
        }else{
            red.style.display="none";
        }

    });

}

function izracunajDug(clan){

    let dug = 0;

    for(let mesec in clan.clanarine){

        let zapis = clan.clanarine[mesec];

        if(
            zapis &&
            zapis.status === "NIJE PLAĆENO"
        ){

            dug += zapis.iznos;

        }

    }

    return dug;

}


function promeniStatus(sifra){

    let clan = clanovi[sifra];

    if(!clan){
        alert("Član nije pronađen.");
        return;
    }

    let datum = new Date();

    let godina = datum.getFullYear();
    let trenutniBrojMeseca = datum.getMonth() + 1;

    // ==========================================
    // NAPRAVI LISTU:
    // TEKUĆI MESEC + 3 MESECA UNAZAD
    // ==========================================

    let meseciZaUplatu = [];

    for(let i = 0; i < 4; i++){

        let d = new Date(
            godina,
            trenutniBrojMeseca - 1 - i,
            1
        );

        let g = d.getFullYear();

        let m = String(d.getMonth() + 1).padStart(2,"0");

        meseciZaUplatu.push(g + "-" + m);

    }


    // ==========================================
    // IZBOR MESECA
    // ==========================================

    let izbor = prompt(
        "Za koji mesec je izvršena uplata?\n\n" +
        "1 - " + meseciZaUplatu[0] + "\n" +
        "2 - " + meseciZaUplatu[1] + "\n" +
        "3 - " + meseciZaUplatu[2] + "\n" +
        "4 - " + meseciZaUplatu[3] + "\n\n" +
        "Unesite broj 1, 2, 3 ili 4:"
    );


    // Ako je korisnik zatvorio prozor
    if(izbor === null){
        return;
    }


    let broj = Number(izbor);


    if(![1,2,3,4].includes(broj)){

        alert("Morate izabrati broj od 1 do 4.");

        return;

    }


    // Izabrani mesec
    let izabraniMesec = meseciZaUplatu[broj - 1];


    // ==========================================
    // OSIGURAJ CLANARINE
    // ==========================================

    if(!clan.clanarine){
        clan.clanarine = {};
    }


    // Ako nema zapisa za izabrani mesec
    if(!clan.clanarine[izabraniMesec]){

        clan.clanarine[izabraniMesec] = {

            iznos: Number(clan.cena) || 0,

            status: "NIJE PLAĆENO"

        };

    }


    let clanarina =
        clan.clanarine[izabraniMesec];



    // ==========================================
    // PONIŠTI UPLATU
    // ==========================================

    if(clanarina.status === "PLAĆENO"){

        clan.clanarine[izabraniMesec] = {

            iznos: Number(clan.cena) || 0,

            status: "NIJE PLAĆENO"

        };


        // Sačuvaj CEO objekat člana
        localStorage.setItem(
            "clanarine",
            JSON.stringify(clanovi)
        );


        location.reload();

        return;

    }


    // ==========================================
    // EVIDENTIRAJ UPLATU
    // ==========================================

    let iznos =
        Number(clanarina.iznos) ||
        Number(clan.cena) ||
        0;


    clan.clanarine[izabraniMesec] = {

        iznos: iznos,

        status: "PLAĆENO",

        datumUplate:
            datum.toISOString().split("T")[0]

    };


    // ==========================================
    // VEOMA VAŽNO
    // ČUVAMO CEO OBJEKAT CLANA
    // ==========================================

    localStorage.setItem(
        "clanarine",
        JSON.stringify(clanovi)
    );


    // ==========================================
    // PODACI ZA POTVRDU
    // ==========================================

    let ime =
        clan.ime ||
        sifra;

    let program =
        clan.program ||
        clan.grupa ||
        "-";

    let email =
        clan.email ||
        "";


    // ==========================================
    // GENERIŠI PDF
    // ==========================================

    napraviPotvrdu(
        sifra,
        izabraniMesec,
        iznos,
        datum
    );


    // ==========================================
    // OTVORI MAIL
    // ==========================================

    if(!email){

        alert(
            "✅ Uplata je evidentirana i PDF potvrda je napravljena.\n\n" +
            "Ovaj član nema unet email."
        );

        setTimeout(function(){

            location.reload();

        },500);

        return;

    }


    let naslov =
        "Potvrda o uplati članarine - " +
        ime;


    let poruka =

        "Poštovani,\n\n" +

        "ovim putem potvrđujemo da je evidentirana " +
        "uplata članarine za igrača:\n\n" +

        "Ime i prezime: " +
        ime +
        "\n" +

        "Šifra člana: " +
        sifra +
        "\n" +

        "Program: " +
        program +
        "\n" +

        "Mesec: " +
        izabraniMesec +
        "\n" +

        "Iznos: " +
        iznos +
        " KM\n" +

        "Datum uplate: " +
        datum.toLocaleDateString("sr-RS") +
        "\n\n" +

        "U prilogu se nalazi PDF potvrda o uplati.\n\n" +

        "Hvala na poverenju.\n\n" +

        "KK Tempo Bratunac";


    let gmailLink =

        "https://mail.google.com/mail/?view=cm&fs=1" +

        "&to=" +
        encodeURIComponent(email) +

        "&su=" +
        encodeURIComponent(naslov) +

        "&body=" +
        encodeURIComponent(poruka);


    // Otvori Gmail
    window.open(
        gmailLink,
        "_blank"
    );


    // Osveži tabelu nakon kratkog vremena
    setTimeout(function(){

        location.reload();

    },1000);

}

function napraviPotvrdu(sifra, mesec, iznos, datum){

    const { jsPDF } = window.jspdf;

    let clan = clanovi[sifra];

    let pdf = new jsPDF();

    pdf.setFontSize(20);

    pdf.text(
        "KK TEMPO BRATUNAC",
        105,
        25,
        {align:"center"}
    );

    pdf.setFontSize(16);

    pdf.text(
        "POTVRDA O UPLATI CLANARINE",
        105,
        45,
        {align:"center"}
    );

    pdf.setFontSize(12);

    pdf.text("Ime i prezime:",20,70);
    pdf.text(
        bezKvacica(clan.ime || sifra),
        70,
        70
    );

    pdf.text("Sifra clana:",20,85);
    pdf.text(sifra,70,85);

    pdf.text("Program:",20,100);
    pdf.text(
        bezKvacica(clan.program || "-"),
        70,
        100
    );

    pdf.text("Mesec:",20,115);
    pdf.text(mesec,70,115);

    pdf.text("Iznos:",20,130);
    pdf.text(iznos + " KM",70,130);

    pdf.text("Datum uplate:",20,145);
    pdf.text(
        datum.toLocaleDateString("sr-RS"),
        70,
        145
    );

    pdf.line(20,160,190,160);

function otvoriDuznike(){

    let tabela = document.getElementById("listaDuznika");

    if(!tabela){
        console.error("Nedostaje HTML element: listaDuznika");
        return;
    }

    let tabelaHTML = "";

    let brojDuznika = 0;


    for(let sifra in clanovi){

        let clan = clanovi[sifra];

        let dugMeseci = 0;
        let ukupanDug = 0;


        for(let mesec in clan.clanarine){


            let brojMeseca = parseInt(mesec.split("-")[1]);


            // ignoriše januar-jul
            if(brojMeseca < 8){
                continue;
            }


            let uplata = clan.clanarine[mesec];


            if(uplata.status === "NIJE PLAĆENO"){

                dugMeseci++;

                ukupanDug += uplata.iznos;

            }


        }


        if(dugMeseci >= 3){

            brojDuznika++;


            tabela.innerHTML += `

            <tr>
                <td>${clan.ime}</td>
                <td>${dugMeseci} meseca</td>
                <td>${ukupanDug} KM</td>
            </tr>

            `;

        }

    }


    if(brojDuznika === 0){

        tabela.innerHTML = `

        <tr>
            <td colspan="3">
                Nema članova sa dugom od 3 ili više meseci
            </td>
        </tr>

        `;

    }

}

function potvrdiMesecUplate(){

    let izbor = document.querySelector(
        'input[name="izabraniMesec"]:checked'
    );


    if(!izbor){

        alert("Molimo izaberite mesec za koji je izvršena uplata.");

        return;

    }


    let sifra = window.clanZaUplatu;

    let clan = clanovi[sifra];


    if(!clan){

        alert("Član nije pronađen.");

        return;

    }


    let mesecUplate = izbor.value;


    // ==========================================
    // OSIGURAJ CLANARINE
    // ==========================================

    if(!clan.clanarine){

        clan.clanarine = {};

    }


    // ==========================================
    // IZNOS
    // ==========================================

    let iznos =

        Number(
            clan.clanarine[mesecUplate]?.iznos
        ) ||

        Number(clan.cena) ||

        0;


    // ==========================================
    // PROVERA DA LI JE VEĆ PLAĆENO
    // ==========================================

    if(

        clan.clanarine[mesecUplate] &&

        clan.clanarine[mesecUplate].status === "PLAĆENO"

    ){

        alert("Ovaj mesec je već označen kao PLAĆEN.");

        return;

    }


    // ==========================================
    // STVARNI DATUM UPLATE
    // ==========================================

    let datum = new Date();


    // ==========================================
    // EVIDENTIRAJ UPLATU
    // ==========================================

    clan.clanarine[mesecUplate] = {

        iznos: iznos,

        status: "PLAĆENO",

        datumUplate:
            datum.toISOString().split("T")[0]

    };


    // ==========================================
    // SAČUVAJ
    // ==========================================

    localStorage.setItem(
        "clanarine",
        JSON.stringify(clanovi)
    );


    // ==========================================
    // PODACI
    // ==========================================

    let ime =
        clan.ime ||
        sifra;


    let program =
        clan.program ||
        clan.grupa ||
        "-";


    let email =
        clan.email ||
        "";


    // ==========================================
    // GENERIŠI PDF
    // ==========================================

    napraviPotvrdu(
        sifra,
        mesecUplate,
        iznos,
        datum
    );


    // ==========================================
    // ZATVORI PROZOR
    // ==========================================

    zatvoriUplatu();


    // ==========================================
    // AKO NEMA EMAIL
    // ==========================================

    if(!email){

        alert(
            "✅ Uplata je evidentirana.\n\n" +
            "PDF potvrda je napravljena.\n\n" +
            "Ovaj član nema unet email."
        );


        setTimeout(function(){

            location.reload();

        },500);


        return;

    }


    // ==========================================
    // EMAIL
    // ==========================================

    let naslov =

        "Potvrda o uplati članarine - " +

        ime;


    let poruka =

        "Poštovani,\n\n" +

        "ovim putem potvrđujemo da je evidentirana " +

        "uplata članarine za igrača:\n\n" +

        "Ime i prezime: " +

        ime +

        "\n" +

        "Šifra člana: " +

        sifra +

        "\n" +

        "Program: " +

        program +

        "\n" +

        "Mesec za koji je izvršena uplata: " +

        mesecUplate +

        "\n" +

        "Iznos: " +

        iznos +

        " KM\n" +

        "Datum uplate: " +

        datum.toLocaleDateString("sr-RS") +

        "\n\n" +

        "U prilogu se nalazi PDF potvrda o uplati.\n\n" +

        "Hvala na poverenju.\n\n" +

        "KK Tempo Bratunac";


let mailtoLink =
    "mailto:" +
    encodeURIComponent(email) +
    "?subject=" +
    encodeURIComponent(naslov) +
    "&body=" +
    encodeURIComponent(poruka);

window.location.href = mailtoLink;


    // ==========================================
    // OSVEŽI TABELU
    // ==========================================

    setTimeout(function(){

        location.reload();

    },1000);

}
