function proveriMesecneDugove(){

    let datum = new Date();

    let godina = datum.getFullYear();
    let trenutniMesec = datum.getMonth()+1;


    for(let sifra in clanovi){

        let clan = clanovi[sifra];


        // prolazi kroz sve mesece od januara do sada
        for(let i = 7; i <= trenutniMesec; i++){


            let brojMeseca = i;

            if(brojMeseca < 10){
                brojMeseca = "0" + brojMeseca;
            }


            let mesec = godina + "-" + brojMeseca;


            // ako je pauza - preskoči
            if(imaPauzu(clan, mesec)){
                continue;
            }


            // ako mesec ne postoji, napravi dug
            if(!clan.clanarine[mesec]){


                clan.clanarine[mesec]={

                    iznos: clan.cena,

                    status:"NIJE PLAĆENO"

                };


            }

        }


    }


    // sačuvaj izmene
    localStorage.setItem(
        "clanarine",
        JSON.stringify(clanovi)
    );


}



// pokretanje pri otvaranju admin panela

function pretraziClanove(){

    let filter = document.getElementById("pretraga")
        .value.toUpperCase();

    let redovi = document.querySelectorAll("#tabela tr");

    redovi.forEach(red=>{

        let sifra = red.cells[0].textContent.toUpperCase();
        let ime = red.cells[1].textContent.toUpperCase();

        if(
            sifra.includes(filter) ||
            ime.includes(filter)
        ){
            red.style.display="";
        }else{
            red.style.display="none";
        }

    });

}

function izracunajDug(clan){

    let dug = 0;

    for(let mesec in clan.clanarine){

        let zapis = clan.clanarine[mesec];

        if(
            zapis &&
            zapis.status === "NIJE PLAĆENO"
        ){

            dug += zapis.iznos;

        }

    }

    return dug;

}



function promeniStatus(sifra){

    let clan = clanovi[sifra];


    if(!clan){

        alert("Član nije pronađen.");

        return;

    }


    let datum = new Date();

    let godina =
        datum.getFullYear();

    let trenutniBrojMeseca =
        datum.getMonth() + 1;


    // ==========================================
    // TEKUĆI MESEC + 3 MESECA UNAZAD
    // ==========================================

    let meseciZaUplatu = [];


    for(let i = 0; i < 4; i++){

        let d = new Date(
            godina,
            trenutniBrojMeseca - 1 - i,
            1
        );


        let g =
            d.getFullYear();


        let m =
            String(
                d.getMonth() + 1
            ).padStart(2,"0");


        meseciZaUplatu.push(
            g + "-" + m
        );

    }


    // ==========================================
    // IZBOR MESECA
    // ==========================================

    let izbor = prompt(

        "Za koji mesec je izvršena uplata?\n\n" +

        "1 - " + meseciZaUplatu[0] + "\n" +

        "2 - " + meseciZaUplatu[1] + "\n" +

        "3 - " + meseciZaUplatu[2] + "\n" +

        "4 - " + meseciZaUplatu[3] + "\n\n" +

        "Unesite broj 1, 2, 3 ili 4:"

    );


    if(izbor === null){

        return;

    }


    let broj =
        Number(izbor);


    if(![1,2,3,4].includes(broj)){

        alert(
            "Morate izabrati broj od 1 do 4."
        );

        return;

    }


    let izabraniMesec =
        meseciZaUplatu[broj - 1];


    // ==========================================
    // OSIGURAJ CLANARINE
    // ==========================================

    if(!clan.clanarine){

        clan.clanarine = {};

    }


    if(!clan.clanarine[izabraniMesec]){

        clan.clanarine[izabraniMesec] = {

            iznos:
                Number(clan.cena) || 0,

            status:
                "NIJE PLAĆENO"

        };

    }


    let clanarina =
        clan.clanarine[izabraniMesec];


    // ==========================================
    // PONIŠTI UPLATU
    // ==========================================

    if(clanarina.status === "PLAĆENO"){

        clan.clanarine[izabraniMesec] = {

            iznos:
                Number(clan.cena) || 0,

            status:
                "NIJE PLAĆENO"

        };


        localStorage.setItem(
            "clanarine",
            JSON.stringify(clanovi)
        );


        location.reload();

        return;

    }


    // ==========================================
    // EVIDENTIRAJ UPLATU
    // ==========================================

    let iznos =

        Number(clanarina.iznos) ||

        Number(clan.cena) ||

        0;


    clan.clanarine[izabraniMesec] = {

        iznos:
            iznos,

        status:
            "PLAĆENO",

        datumUplate:
            datum
                .toISOString()
                .split("T")[0]

    };


    // ==========================================
    // SAČUVAJ PODATKE
    // ==========================================

    localStorage.setItem(
        "clanarine",
        JSON.stringify(clanovi)
    );


    // ==========================================
    // PODACI ZA POTVRDU
    // ==========================================

    let ime =
        clan.ime ||
        sifra;


    let program =
        clan.program ||
        clan.grupa ||
        "-";


    let email =
        clan.email ||
        "";


    // ==========================================
    // GENERIŠI PDF
    // ==========================================

    napraviPotvrdu(

        sifra,

        izabraniMesec,

        iznos,

        datum

    );


    // ==========================================
    // AKO NEMA EMAIL
    // ==========================================

    if(!email){

        alert(

            "✅ Uplata je evidentirana.\n\n" +

            "PDF potvrda je napravljena.\n\n" +

            "Ovaj član nema unet email."

        );

        return;

    }


    // ==========================================
    // NASLOV MAILA
    // ==========================================

    let naslov =

        "Potvrda o uplati članarine - " +

        ime;


    // ==========================================
    // TEKST MAILA
    // ==========================================

    let poruka =

        "Poštovani,\n\n" +

        "ovim putem potvrđujemo da je evidentirana " +

        "uplata članarine za igrača:\n\n" +

        "Ime i prezime: " +

        ime +

        "\n" +

        "Šifra člana: " +

        sifra +

        "\n" +

        "Program: " +

        program +

        "\n" +

        "Mesec: " +

        izabraniMesec +

        "\n" +

        "Iznos: " +

        iznos +

        " KM\n" +

        "Datum uplate: " +

        datum.toLocaleDateString("sr-RS") +

        "\n\n" +

        "U prilogu se nalazi PDF potvrda o uplati.\n\n" +

        "Hvala na poverenju.\n\n" +

        "KK Tempo Bratunac";


    // ==========================================
    // OTVARANJE MAILA
    // ==========================================

    let mobilniUredjaj =

        /Android|iPhone|iPad|iPod/i.test(

            navigator.userAgent

        );


    if(mobilniUredjaj){

        // TELEFON / TABLET

        let mailToLink =

            "mailto:" +

            email +

            "?subject=" +

            encodeURIComponent(naslov) +

            "&body=" +

            encodeURIComponent(poruka);


        window.location.href =
            mailToLink;


    }else{

        // RAČUNAR

        let gmailLink =

            "https://mail.google.com/mail/?view=cm&fs=1" +

            "&to=" +

            encodeURIComponent(email) +

            "&su=" +

            encodeURIComponent(naslov) +

            "&body=" +

            encodeURIComponent(poruka);


        window.open(

            gmailLink,

            "_blank"

        );

    }

}



function napraviPotvrdu(
    sifra,
    mesecUplate,
    iznos,
    datum
){

    const { jsPDF } = window.jspdf;


    let clan = clanovi[sifra];


    if(!clan){

        alert("Član nije pronađen.");

        return;

    }


    let ime =
        clan.ime ||
        sifra;


       let program =
        clan.program ||
        clan.grupa ||
        "-";


    let email =
        (clan.email || "").trim();


    // ==========================================
    // GENERIŠI PDF
    // ==========================================

    try{

        napraviPotvrdu(
            sifra,
            mesecUplate,
            iznos,
            datum
        );

    }
    catch(error){

        console.error(
            "Greška pri pravljenju PDF-a:",
            error
        );

    }


    // ==========================================
    // AKO NEMA EMAIL
    // ==========================================

    if(!email){

        alert(
            "✅ Uplata je evidentirana.\n\n" +
            "PDF potvrda je napravljena.\n\n" +
            "Ovaj član nema unet email."
        );

        zatvoriUplatu();

        setTimeout(function(){

            location.reload();

        },500);

        return;

    }


    // ==========================================
    // NASLOV EMAILA
    // ==========================================

    let naslov =
        "Potvrda o uplati članarine - " +
        ime;


    // ==========================================
    // TEKST EMAILA
    // ==========================================

    let poruka =

        "Poštovani,\n\n" +

        "ovim putem potvrđujemo da je evidentirana " +
        "uplata članarine za igrača:\n\n" +

        "Ime i prezime: " +
        ime +
        "\n" +

        "Šifra člana: " +
        sifra +
        "\n" +

        "Program: " +
        program +
        "\n" +

        "Mesec za koji je izvršena uplata: " +
        mesecUplate +
        "\n" +

        "Iznos: " +
        iznos +
        " KM\n" +

        "Datum uplate: " +
        datum.toLocaleDateString("sr-RS") +
        "\n\n" +


        "Hvala na poverenju.\n\n" +

        "KK Tempo Bratunac";


    // ==========================================
    // ENCODE
    // ==========================================

    let subject =
        encodeURIComponent(naslov);

    let body =
        encodeURIComponent(poruka);

    let to =
        encodeURIComponent(email);


    // ==========================================
    // PREPOZNAJ UREĐAJ
    // ==========================================

    let mobilniUredjaj =
        /Android|iPhone|iPad|iPod/i.test(
            navigator.userAgent
        );


    // ==========================================
    // TELEFON / TABLET
    // ==========================================

    if(mobilniUredjaj){

        let mailToLink =
            "mailto:" +
            to +
            "?subject=" +
            subject +
            "&body=" +
            body;


        window.location.href =
            mailToLink;

    }


    // ==========================================
    // RAČUNAR
    // ==========================================

    else{

        let gmailLink =
            "https://mail.google.com/mail/?view=cm&fs=1" +
            "&to=" +
            to +
            "&su=" +
            subject +
            "&body=" +
            body;


        window.open(
            gmailLink,
            "_blank"
        );

    }


    // ==========================================
    // ZATVORI MODAL
    // ==========================================

    zatvoriUplatu();


    // ==========================================
    // OSVEŽI TABELU
    // ==========================================

    setTimeout(function(){

        location.reload();

    },5000);

}

</script>


</section>
