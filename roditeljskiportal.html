function normalizujTekst(tekst){

    return tekst
        .toLowerCase()
        .trim()

        // ćirilica → latinica
        .replace(/љ/g,"lj")
        .replace(/њ/g,"nj")
        .replace(/џ/g,"dz")

        .replace(/а/g,"a")
        .replace(/б/g,"b")
        .replace(/в/g,"v")
        .replace(/г/g,"g")
        .replace(/д/g,"d")
        .replace(/ђ/g,"dj")
        .replace(/е/g,"e")
        .replace(/ж/g,"z")
        .replace(/з/g,"z")
        .replace(/и/g,"i")
        .replace(/ј/g,"j")
        .replace(/к/g,"k")
        .replace(/л/g,"l")
        .replace(/м/g,"m")
        .replace(/н/g,"n")
        .replace(/о/g,"o")
        .replace(/п/g,"p")
        .replace(/р/g,"r")
        .replace(/с/g,"s")
        .replace(/т/g,"t")
        .replace(/ћ/g,"c")
        .replace(/у/g,"u")
        .replace(/ф/g,"f")
        .replace(/х/g,"h")
        .replace(/ц/g,"c")
        .replace(/ч/g,"c")
        .replace(/ш/g,"s")

        // latinica sa kvačicama
        .replace(/č/g,"c")
        .replace(/ć/g,"c")
        .replace(/š/g,"s")
        .replace(/ž/g,"z")
        .replace(/đ/g,"dj");
}


function pronadjiSifru(){

    let ime = normalizujTekst(
        document.getElementById("imeDeteta").value
    );

    let godiste = document.getElementById("godisteDeteta").value.trim();

    let pronadjena = false;

    for(let sifra in clanovi){

        let clan = clanovi[sifra];

        if(
            normalizujTekst(clan.ime) === ime &&
            clan.godiste === godiste
        ){

            document.body.insertAdjacentHTML("beforeend",`

<div id="popupSifra" style="
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,.75);
display:flex;
justify-content:center;
align-items:center;
z-index:99999;
">

<div style="
background:white;
padding:35px;
border-radius:20px;
text-align:center;
width:380px;
max-width:90%;
box-shadow:0 15px 40px rgba(0,0,0,.35);
">

<h2 style="color:#c8102e;">
🔑 Vaša šifra
</h2>

<h1 id="tekstSifre"
style="
color:#c8102e;
font-size:32px;
margin:20px 0;
letter-spacing:2px;
">
${sifra}
</h1>

<button
onclick="kopirajSifru(this)"
style="
padding:12px 30px;
background:#c8102e;
color:white;
border:none;
border-radius:50px;
font-size:16px;
cursor:pointer;
margin-bottom:15px;
">
📋 Kopiraj šifru
</button>

<br><br>

<button
onclick="zatvoriPopupSifra()"
style="
padding:10px 30px;
background:#555;
color:white;
border:none;
border-radius:50px;
font-size:15px;
cursor:pointer;
">
Zatvori
</button>

</div>
</div>

`);

            pronadjena = true;
            break;
        }
    }

    if(!pronadjena){
        alert("Nismo pronašli člana sa tim podacima.");
    }
}

function kopirajSifru(dugme){

    const sifra = document.getElementById("tekstSifre").innerText;

    navigator.clipboard.writeText(sifra).then(function(){

        dugme.innerHTML = "✅ Kopirano!";

        setTimeout(function(){
            dugme.innerHTML = "📋 Kopiraj šifru";
        },2000);

    }).catch(function(){
        alert("Kopiranje nije uspelo.");
    });

}

function zatvoriPopupSifra(){

    document.getElementById("popupSifra").remove();

}
