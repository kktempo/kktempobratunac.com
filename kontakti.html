<!DOCTYPE html>
<html lang="sr">

<head>

<title>Kontakt podaci | KK Tempo</title>



<style>


body{

font-family:Arial,sans-serif;
background:#f3f3f3;
margin:0;

}



.container{

width:95%;
max-width:1300px;
margin:30px auto;

h1{

.dugme{

.pretraga{

border:1px solid #ccc;

font-size:16px;

th{

</head>




<body>




<div class="container">





<button class="dugme"
onclick="location.href='baza.html'">

⬅ NAZAD

</button>





<h1>

KONTAKT PODACI ČLANOVA

</h1>





<input 
type="text"
id="pretraga"
class="pretraga"
placeholder="🔍 Pretraži člana..."
onkeyup="pretrazi()"
>







<div class="tabela">



<table>


<thead>

<tr>

<th>Šifra</th>

<th>Ime deteta</th>

<th>Roditelj</th>

<th>Telefon</th>

<th>Email</th>

<th>Grupa</th>

<th>Dugovanje</th>

<th>Pošalji opomenu</th>

<th>Akcija</th>


</tr>

</thead>




<tbody id="tabelaClanovi">


</tbody>



</table>



</div>







</div>








<script>


// UČITAVANJE SVIH ČLANOVA IZ EVIDENCIJE ČLANARINE

let clanovi = 
JSON.parse(localStorage.getItem("clanarine"))
|| {};



let tabela = document.getElementById("tabelaClanovi");



function ucitajClanove(){


tabela.innerHTML="";



for(let sifra in clanovi){



let clan = clanovi[sifra];



let red = document.createElement("tr");



red.innerHTML = `

<td>${sifra}</td>

<td>
${clan.ime || clan.imePrezime || sifra}
</td>

<td>
${clan.roditelj || ""}
</td>

<td>
<a href="tel:${clan.telefon || ''}">
${clan.telefon || ""}
</a>
</td>

<td>
<a href="mailto:${clan.email || ''}">
${clan.email || ""}
</a>
</td>

<td>
${clan.grupa || clan.program || ""}
</td>

<td>

<button 
class="dugmeDug"
onclick="proveriDug('${sifra}')">

DUG

</button>

</td>

<td>

<button 
class="mailDug"
onclick="posaljiMail('${sifra}')">

POŠALJI

</button>

</td>


<td>

<button 
onclick="urediClana('${sifra}')">

UREDI

</button>

</td>

`;


tabela.appendChild(red);



}



}




function pretrazi(){


let unos =
document.getElementById("pretraga")
.value
.toLowerCase();



let redovi =
tabela.getElementsByTagName("tr");



for(let i=0;i<redovi.length;i++){


let tekst =
redovi[i].innerText.toLowerCase();



if(tekst.includes(unos)){


redovi[i].style.display="";


}
else{


redovi[i].style.display="none";


}



}



}





ucitajClanove();



if("serviceWorker" in navigator){

navigator.serviceWorker.register("service-worker.js");

}

function urediClana(sifra){


let clan = clanovi[sifra];


let roditelj = prompt(
"Unesi ime roditelja:",
clan.roditelj || ""
);



if(roditelj===null)
return;



let telefon = prompt(
"Unesi telefon:",
clan.telefon || ""
);



if(telefon===null)
return;




let email = prompt(
"Unesi email:",
clan.email || ""
);



if(email===null)
return;



let grupa = prompt(
"Unesi grupu:",
clan.grupa || clan.program || ""
);



if(grupa===null)
return;



clan.roditelj = roditelj;

clan.telefon = telefon;

clan.email = email;

clan.grupa = grupa;



// snimanje nazad u bazu

localStorage.setItem(
"clanarine",
JSON.stringify(clanovi)
);



alert("Podaci uspešno sačuvani!");



location.reload();



}

function proveriDug(sifra){


let clan = clanovi[sifra];


let dug=0;
let meseci=[];



if(clan.clanarine){


for(let mesec in clan.clanarine){


let zapis = clan.clanarine[mesec];


if(
zapis &&
zapis.status !== "PLAĆENO"
){


dug += zapis.iznos;

meseci.push(mesec);


}


}



}



if(dug===0){


alert(
"✅ "+(clan.ime || sifra)+
"\n\nNema dugovanja."
);


}

else{


alert(

"⚠️ "+(clan.ime || sifra)+

"\n\nDuguje: "+
dug+" KM"+

"\n\nMeseci:\n"+
meseci.join("\n")

);


}


}

function posaljiMail(sifra){


let clan = clanovi[sifra];

let mailProzor = window.open(
    "mailto:" + clan.email
);

if(!clan.email){

alert("Ovaj član nema unet email!");

return;

}



let dug = 0;
let meseci = [];



if(clan.clanarine){


for(let mesec in clan.clanarine){


let zapis = clan.clanarine[mesec];


if(
zapis &&
zapis.status !== "PLAĆENO"
){


dug += zapis.iznos;

meseci.push(mesec);


}


}


}



if(dug<=0){


alert("Ovaj član nema dugovanja.");

return;


}




let ime =
clan.ime || sifra;



let naslov =
"Obavestenje o dugovanju clanarine kosarkaskom klubu Tempo";



let poruka =

"Poštovani,\n\n"+

"Obavestavamo Vas da za clana "+ime+
" postoji neizmireno dugovanje clanarine.\n\n"+

"Ukupan dug: "+dug+" KM\n\n"+

"Neplaceni meseci:\n"+
meseci.join("\n")+

"\n\nMolimo Vas da izvrsite uplatu u najkracem roku.\n\n"+

"KK Tempo Bratunac";




let gmailLink =

"https://mail.google.com/mail/?view=cm&fs=1&to="+
encodeURIComponent(clan.email)+

"&su="+
encodeURIComponent(naslov)+

"&body="+
encodeURIComponent(poruka);



window.open(gmailLink,"_blank");



window.location.href=link;


}

function posaljiMail(sifra){


let clan = clanovi[sifra];


if(!clan){

alert("Član nije pronađen");

return;

}



if(!clan.email){

alert("Član nema unet email");

return;

}



let dug = 0;

let meseci = [];



if(clan.clanarine){


for(let mesec in clan.clanarine){


let zapis = clan.clanarine[mesec];


if(
zapis &&
zapis.status !== "PLAĆENO"
){


dug += Number(zapis.iznos);

meseci.push(
    bezKvacica(mesec)
);


}


}


}



if(dug <=0){

alert("Član nema dugovanja");

return;

}



let ime =
bezKvacica(clan.ime || sifra);


let program =
bezKvacica(clan.program || "-");



/*
================================
 QR VODI SAMO NA PORTAL
================================
*/


let portalURL =
window.location.origin+
"/roditeljski-portal.html";



let qrDiv =
document.createElement("div");


qrDiv.style.position="absolute";

qrDiv.style.left="-9999px";


document.body.appendChild(qrDiv);



new QRCode(
qrDiv,
{

text:portalURL,

width:300,

height:300

}
);



setTimeout(()=>{


let canvas =
qrDiv.querySelector("canvas");


let qrImage =
canvas.toDataURL("image/png");



const {jsPDF}=window.jspdf;


let pdf =
new jsPDF();



/*
=========================
 MEMORANDUM
=========================
*/


pdf.setFillColor(200,16,46);

pdf.rect(
0,
0,
210,
8,
"F"
);



pdf.setFontSize(20);

pdf.setFont(
"helvetica",
"bold"
);


pdf.setTextColor(200,16,46);


pdf.text(
"KOSARKASKI KLUB TEMPO",
105,
25,
{
align:"center"
}
);



pdf.setFontSize(10);

pdf.setTextColor(80,80,80);


pdf.text(
"BRATUNAC",
105,
32,
{
align:"center"
}
);


pdf.text(
"Podsetnik za uplatu clanarine",
105,
38,
{
align:"center"
}
);



pdf.line(
20,
45,
190,
45
);




/*
=========================
 NASLOV
=========================
*/


pdf.setFontSize(17);

pdf.setTextColor(40,40,40);


pdf.text(
"PODSETNIK ZA UPLATU CLANARINE",
105,
60,
{
align:"center"
}
);




/*
=========================
 PODACI
=========================
*/


pdf.setFontSize(12);


let y=85;


pdf.text(
"Ime i prezime:",
20,
y
);


pdf.text(
ime,
75,
y
);



y+=12;


pdf.text(
"Sifra clana:",
20,
y
);


pdf.text(
sifra,
75,
y
);



y+=12;


pdf.text(
"Program:",
20,
y
);


pdf.text(
program,
75,
y
);



y+=12;


pdf.text(
"Ukupno dugovanje:",
20,
y
);



pdf.setTextColor(200,16,46);


pdf.text(
dug+" KM",
75,
y
);




/*
=========================
 MESECI
=========================
*/


y+=20;


pdf.setTextColor(40,40,40);


pdf.text(
"Neplaceni meseci:",
20,
y
);


y+=10;


meseci.forEach(m=>{


pdf.text(
"- "+m,
25,
y
);


y+=8;


});





/*
=========================
 QR SEKCIJA
=========================
*/


pdf.setTextColor(200,16,46);

pdf.setFontSize(12);


pdf.text(
"RODITELJSKI PORTAL",
150,
160,
{
align:"center"
}
);



pdf.setTextColor(40,40,40);


pdf.setFontSize(11);


pdf.text(
"SIFRA CLANA:",
150,
170,
{
align:"center"
}
);



pdf.setFontSize(16);


pdf.setTextColor(200,16,46);


pdf.text(
sifra,
150,
180,
{
align:"center"
}
);



pdf.addImage(
qrImage,
"PNG",
125,
190,
50,
50
);



pdf.setFontSize(9);

pdf.setTextColor(80,80,80);


pdf.text(
"Skenirajte QR kod za ulazak",
150,
250,
{
align:"center"
}
);


pdf.text(
"na roditeljski portal",
150,
256,
{
align:"center"
}
);



/*
=========================
 DONJA LINIJA
=========================
*/


pdf.setFillColor(200,16,46);


pdf.rect(
0,
280,
210,
12,
"F"
);



pdf.setTextColor(
255,
255,
255
);


pdf.text(
"KK TEMPO BRATUNAC",
105,
288,
{
align:"center"
}
);





let naziv =

"Podsetnik_"+

sifra+

".pdf";



pdf.save(naziv);




/*
=========================
 EMAIL
=========================
*/


let naslov =

"Podsetnik za uplatu članarine - "+ime;



let tekst =

"Poštovani,\n\n"+

"u prilogu se nalazi podsetnik za uplatu članarine.\n\n"+

"Član: "+ime+"\n"+

"Ukupno dugovanje: "+dug+" KM\n\n"+

"Šifra člana za Roditeljski portal je: "+sifra+"\n\n"+

"KK Tempo Bratunac";




let gmailLink =

"https://mail.google.com/mail/?view=cm&fs=1" +

"&to=" +
encodeURIComponent(clan.email) +

"&su=" +
encodeURIComponent(naslov) +

"&body=" +
encodeURIComponent(tekst);


window.open(
    gmailLink,
    "_blank"
);



qrDiv.remove();



},500);



}

function bezKvacica(tekst){

    if(!tekst) return "";

    return tekst
    .replace(/č/g,"c")
    .replace(/ć/g,"c")
    .replace(/š/g,"s")
    .replace(/ž/g,"z")
    .replace(/đ/g,"dj")
    .replace(/Č/g,"C")
    .replace(/Ć/g,"C")
    .replace(/Š/g,"S")
    .replace(/Ž/g,"Z")
    .replace(/Đ/g,"Dj");

}

</script>




</body>
