<!DOCTYPE html>
<html lang="sr">

<head>

<link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#c8102e">

<link rel="apple-touch-icon" href="icons/icon-192.png">


<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>Baza podataka | KK Tempo</title>



<style>

.dugme{

background:#c8102e;
color:white;
padding:12px 25px;
border-radius:30px;
text-decoration:none;
font-weight:bold;
display:inline-block;
margin-top:15px;

}


.dugme:hover{

background:#8b001f;

}


body{

font-family:Arial,sans-serif;
background:#f3f3f3;
margin:0;

}



.container{

width:95%;
max-width:1300px;
margin:30px auto;

}



h1{

text-align:center;
color:#c8102e;
margin-bottom:40px;

}



.dugme{


background:#c8102e;
color:white;

padding:12px 25px;

border-radius:25px;

border:none;

cursor:pointer;

font-weight:bold;

margin-bottom:20px;

}



.kartice{


display:grid;

grid-template-columns:repeat(3,1fr);

gap:25px;


}



.kartica{


background:white;

padding:35px 20px;

border-radius:20px;

text-align:center;

box-shadow:0 5px 15px #ccc;


transition:.3s;


}



.kartica:hover{

transform:translateY(-5px);

}



.kartica h2{


color:#c8102e;

font-size:25px;


}



.kartica p{

font-size:16px;

color:#555;

}



.kartica button{


background:#c8102e;

color:white;

border:none;

padding:12px 30px;

border-radius:25px;

font-weight:bold;

cursor:pointer;


}




@media(max-width:800px){


.kartice{

grid-template-columns:1fr;

}


}



</style>


</head>



<body>



<div class="container">



<button class="dugme"
onclick="location.href='admin.html'">

⬅ NAZAD

</button>



<h1>

KOMUNIKACIONI SISTEM

</h1>




<div class="kartice">





<div class="kartica">


<h2>

KONTAKT PODACI ČLANOVA

</h2>


<p>

Telefon roditelja<br>
Email<br>
Adresa

</p>


<button onclick="otvoriKontakte()">

OTVORI

</button>


</div>









<div class="kartica">


<h2>
E-MAIL I VIBER SISTEM
</h2>


<p>
Komunikacija sa roditeljima
</p>


<a href="dokumentacija.html" class="dugme">
OTVORI
</a>


</div>






</div>



</div>






<script>


function otvoriKontakte(){


location.href="kontakti.html";


}



</script>




<script>


if("serviceWorker" in navigator){

navigator.serviceWorker.register("service-worker.js");

}


</script>




</body>

</html>
